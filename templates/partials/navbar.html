<header class="app-header">
  <div class="header-container">
    <a href="/" class="logo">Listen<span>MK</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="/" class="{{ 'active' if active_page == 'home' else '' }}"
        >Discover</a
      >
      <a href="/about" class="{{ 'active' if active_page == 'about' else '' }}"
        >About</a
      >
      <a
        href="/favorites"
        class="{{ 'active' if active_page == 'favorites' else '' }}"
        >Favorites</a
      >
    </nav>

    <div class="auth-links">
      {% if 'user_id' in session %}
      <div class="user-menu-wrapper">
        <button class="user-menu-button" type="button" aria-label="User menu">
          <span class="user-avatar">{{ session.name[0]|upper }}</span>
          <span class="user-name">{{ session.name }}</span>
          <span class="user-chevron">▾</span>
        </button>

        <div class="user-dropdown" role="menu" aria-label="User account menu">
          <a href="#" class="dropdown-item">Settings</a>
          <a href="/logout" class="dropdown-item">Log out</a>
        </div>
      </div>
      {% else %}
      <a
        href="/login"
        class="auth-btn secondary {{ 'active' if active_page == 'login' else '' }}"
        >Login</a
      >
      <a
        href="/signup"
        class="auth-btn primary {{ 'active' if active_page == 'signup' else '' }}"
        >Sign Up</a
      >
      {% endif %}
    </div>
  </div>
</header>
